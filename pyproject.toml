[project]
name = "finsight"
version = "1.1.0"
description = "FinSight: Enterprise AI Workspace with Role-Based Access Control (RBAC), Postgres/pgvector Hybrid RAG, Parquet SQL Sandbox, and RAGAS Evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.129.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "slowapi>=0.1.10,<0.2.0",
    "redis>=5.0.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
    "taskiq>=0.11.10,<1.0.0",
    "taskiq-redis>=1.0.2,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "boto3>=1.35.0,<2.0.0",
    "google-genai>=3.3.0,<4.0.0",
    "langchain-google-genai>=4.5.0,<5.0.0",
    "langchain>=1.5.0,<2.0.0",
    "langchain-core>=1.8.0,<2.0.0",
    "langchain-community>=0.4.2,<1.0.0",
    "langgraph>=1.2.22,<2.0.0",
    "langgraph-checkpoint>=4.3.2,<5.0.0",
    "langgraph-checkpoint-postgres>=3.2.1,<4.0.0",
    "bcrypt>=4.3.0,<5.0.0",
    "openfga-sdk>=0.10.6,<1.0.0",
    "authlib>=1.9.8,<2.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0,<25.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.34.2,<3.0.0",
    "cohere>=5.21.1,<6.0.0",
    "langchain-cohere>=0.6.0,<1.0.0",
    "duckdb>=1.3.2,<2.0.0",
    "sqlglot>=25.0.0,<30.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "PyJWT>=2.11.0,<3.0.0",
    "pdfplumber>=0.11.9,<0.12.0",
    "ragas>=0.4.4,<0.5.0",
    "datasets>=2.14.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
]


[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_temp -m 'not slow'"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (require live vectorstore + API key). Deselect with -m 'not slow'",
    "postgres: marks integration tests requiring a live PostgreSQL 17 + pgvector database",
]
