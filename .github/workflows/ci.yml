name: Verify FinSight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint -- --deny-warnings
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight-ci-password
          POSTGRES_DB: finsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finsight -d finsight_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://finsight:finsight-ci-password@localhost:5432/finsight_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # Separate processes keep regression fixtures independent.
      - name: Run Phase 3 OWASP & ReBAC deterministic red-team gates
        env:
          DATABASE_URL: postgresql+psycopg://finsight:finsight-ci-password@localhost:5432/finsight_test
          TEST_DATABASE_URL: postgresql+psycopg://finsight:finsight-ci-password@localhost:5432/finsight_test
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
          GOOGLE_API_KEY: offline-ci-test-key
          JWT_SECRET: offline-ci-test-signing-secret-at-least-32-chars
        run: |
          python -m pytest tests/test_phase3_redteam_gates.py verification/test_security.py -v
      - name: Run full backend test suite (including live Postgres integration)
        env:
          DATABASE_URL: postgresql+psycopg://finsight:finsight-ci-password@localhost:5432/finsight_test
          TEST_DATABASE_URL: postgresql+psycopg://finsight:finsight-ci-password@localhost:5432/finsight_test
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
          GOOGLE_API_KEY: offline-ci-test-key
          JWT_SECRET: offline-ci-test-signing-secret-at-least-32-chars
        run: |
          python -m pytest tests -v -m "not slow"
